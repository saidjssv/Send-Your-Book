<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/main.css">
    <title>Send-Your-Book</title>
</head>

<body>
    <div class="container">
        <h1>Bienvenido a Send Your Book</h1>
        <h3>Agrega un libro a la base de datos :3</h3>
        <div class="formulario">
            <form id="bookForm">
                <div class="form-group">
                    <label for="Titulo">Título del libro</label>
                    <input type="text" name="title" placeholder="Ej: El Principito">
                </div>
                <div class="form-group">
                    <label for="Autor">Autor del libro</label>
                    <input type="text" name="author" placeholder="Ej: Antoine de Saint-Exupéry">
                </div>
                <div class="form-group">
                    <label for="Número de páginas">Número de páginas</label>
                    <input type="text" name="pages" placeholder="Ej: 96">
                </div>
                <div class="form-group">
                    <label for="Año de publicación">Año de publicación</label>
                    <input type="text" name="year" placeholder="Ej: 1943">
                </div>
                <div class="form-group">
                    <label for="Género">Género del libro</label>
                    <input type="text" name="genre" placeholder="Ej: Literatura infantil">
                </div>
                <div class="form-group">
                    <label for="Editorial">Editorial</label>
                    <input type="text" name="publisher" placeholder="Ej: Editorial Planeta">
                </div>

                <button type="submit">Enviar</button>
            </form>
        </div>
    </div>
</body>

</html>
