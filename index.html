<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/main.css">
    <title>Send-Your-Book</title>
</head>

<body>
    <div class="container">
        <h1>Bienvenido a Send Your Book</h1>
        <h3>Agrega un libro a la base de datos :3</h3>
        <div class="formulario">
            <form id="bookForm">
                <div class="form-group">
                    <input type="text" name="title" placeholder=" " id="title" required>
                    <label for="title">Título del libro</label>
                </div>
                <div class="form-group">
                    <input type="text" name="author" placeholder=" " id="author" required>
                    <label for="author">Autor del libro</label>
                </div>
                <div class="form-group">
                    <input type="text" name="pages" placeholder=" " id="pages" required>
                    <label for="pages">Número de páginas</label>
                </div>
                <div class="form-group">
                    <input type="date" name="year" placeholder=" " id="year" required style="cursor: pointer">
                    <label for="year">Fecha de publicación</label>
                </div>
                <div class="form-group">
                    <input type="text" name="genre" placeholder=" " id="genre" required>
                    <label for="genre">Género del libro</label>
                </div>
                <div class="form-group">
                    <input type="text" name="publisher" placeholder=" " id="publisher" required>
                    <label for="publisher">Editorial</label>
                </div>

                <button type="submit">Enviar</button>
            </form>
        </div>
    </div>
</body>

</html>
