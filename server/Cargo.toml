[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.53.2", features = ["full"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "mysql", "chrono" ] }
serde = { version = "1.0", features = ["derive"] }
dotenvy = "0.15"
tower-http = { version = "0.7.1", features = ["cors"] }